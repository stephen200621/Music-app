
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f -name pubspec.yaml \
            -not -path './.git/*' \
            -not -path '*/.dart_tool/*' \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No pubspec.yaml found in repository."
            echo "Check that the Flutter project files were uploaded."
            exit 1
          fi

          echo "Found Flutter project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Create asset folders
        working-directory: ${{ steps.project.outputs.dir }}
        run: mkdir -p assets/audio assets/images

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-3D-Debug-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
