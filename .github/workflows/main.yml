
name: Build VYBE 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify project
        run: |
          test -f pubspec.yaml
          test -f android/settings.gradle
          flutter --version
          java -version
          gradle --version

      - name: Configure Android SDK paths
        run: |
          echo "flutter.sdk=$(dirname "$(dirname "$(which flutter)")")" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          mkdir -p assets/audio assets/images

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3

      - name: Get Flutter dependencies
        run: flutter pub get

      
      - name: Fix audio_query Android namespace
        shell: bash
        run: |
          PLUGIN_FILE=$(find "$HOME/.pub-cache" -path '*/audio_query_android-*/android/build.gradle' -print -quit)

          if [ -z "$PLUGIN_FILE" ]; then
            PLUGIN_FILE=$(find "$HOME/.pub-cache" -path '*/audio_query_android-*/android/build.gradle.kts' -print -quit)
          fi

          if [ -z "$PLUGIN_FILE" ]; then
            echo "Could not find audio_query_android Gradle file."
            find "$HOME" -path '*audio_query_android*' -print 2>/dev/null | head -50
            exit 1
          fi

          echo "Found plugin file: $PLUGIN_FILE"

          if ! grep -q 'namespace' "$PLUGIN_FILE"; then
            sed -i '/^[[:space:]]*android[[:space:]]*{/a\    namespace "com.avinash.on_audio_query"' "$PLUGIN_FILE"
          fi

          grep -n 'namespace' "$PLUGIN_FILE"


      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-3D-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
