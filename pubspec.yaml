name: vybe_3d
description: "VYBE 3D - Personal AI Music Player with Immersive 3D Motion and Offline Intelligence"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Audio Playback & Background Media Notification
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18

  # Persistence & Database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Media Access & Permissions
  permission_handler: ^11.1.0
  on_audio_query: ^2.9.0

  # UI, Icons, Glassmorphism & Math
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
